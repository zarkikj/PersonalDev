name: assemble-upload
# bridge-assemble-v2 (bridge 會檢查這個標記；舊版 workflow 不支援多檔打包)

# bridge 把檔案切片上傳到 uploads/<job>/<檔案序號>/NNN.part，最後上傳 meta.json
# 觸發本 workflow：
#   依 meta 把每個檔案的分片組回原檔(驗證大小) → 建「一個」Release 裝全部檔案
#   → 上傳 asset → 清掉分片目錄
on:
  push:
    paths:
      - 'uploads/**/meta.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-upload
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble chunks into one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for dir in uploads/*/; do
            meta="${dir}meta.json"
            [ -f "$meta" ] || continue
            found=1
            job=$(jq -r '.job' "$meta")
            nfiles=$(jq -r '.files | length' "$meta")
            assets=()
            title="bridge upload ${job}"
            i=0
            while [ "$i" -lt "$nfiles" ]; do
              name=$(jq -r ".files[$i].name" "$meta")
              chunks=$(jq -r ".files[$i].chunks" "$meta")
              want=$(jq -r ".files[$i].size" "$meta")
              out="${RUNNER_TEMP}/${name}"
              : > "$out"
              j=0
              while [ "$j" -lt "$chunks" ]; do
                part=$(printf '%s%02d/%03d.part' "$dir" "$i" "$j")
                if [ ! -f "$part" ]; then
                  echo "::error::missing chunk $part"
                  exit 1
                fi
                cat "$part" >> "$out"
                j=$((j + 1))
              done
              got=$(stat -c%s "$out")
              echo "assembled ${name}: ${got} bytes (expected ${want})"
              if [ "$got" != "$want" ]; then
                echo "::error::size mismatch for ${name}"
                exit 1
              fi
              assets+=("$out")
              if [ "$nfiles" = "1" ]; then
                title="$name"
              fi
              i=$((i + 1))
            done
            gh release create "up-${job}" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "bridge upload (auto-assembled from chunks)" \
              || gh release upload "up-${job}" "${assets[@]}" \
                   --repo "$GITHUB_REPOSITORY" --clobber
            rm -rf "$dir"
          done
          if [ "$found" = "0" ]; then
            echo "no pending upload job"
          fi

      - name: Cleanup chunk directory
        if: always()
        run: |
          set -euo pipefail
          git config user.name "bridge-bot"
          git config user.email "bridge-bot@users.noreply.github.com"
          git add -A uploads || true
          if git diff --cached --quiet; then
            echo "nothing to clean"
            exit 0
          fi
          git commit -m "cleanup assembled upload chunks"
          git push origin "HEAD:${GITHUB_REF_NAME}"
